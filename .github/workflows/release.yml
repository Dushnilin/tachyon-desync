name: Release

on:
  push:
    tags:
      - 'v*'
  repository_dispatch:
    types: [core-updated]
  schedule:
    # Каждые 3 часа проверяем, не вышло ли обновление движка в закрытом Dushnilin/tachyon-core-src
    - cron: '20 */3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (оставьте пустым для авто-инкремента версии из свежего tachyon-core-src)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      core_ref: ${{ steps.meta.outputs.core_ref }}
      core_tag: ${{ steps.meta.outputs.core_tag }}
      core_sha: ${{ steps.meta.outputs.core_sha }}
      skip: ${{ steps.meta.outputs.skip }}
    steps:
      - name: Checkout tachyon-desync
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          fetch-depth: 0

      - name: Checkout private desync engine from Dushnilin/tachyon-core-src
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ github.event.client_payload.tag || 'main' }}
          fetch-depth: 30
          path: _tachyon_core_src

      - name: Resolve version or auto-bump on upstream core update
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_CORE_TAG: ${{ github.event.client_payload.tag }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          cd _tachyon_core_src
          core_sha=$(git log -n 1 --pretty=format:%H -- crates/core-runtime/src/outbound)
          core_tag="${DISPATCH_CORE_TAG}"
          if [ -z "$core_tag" ]; then
            core_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "main")
          fi
          core_ver="${core_tag#v}"
          cd ..

          echo "core_sha=${core_sha}" >> "$GITHUB_OUTPUT"
          echo "core_tag=${core_tag}" >> "$GITHUB_OUTPUT"
          echo "core_ref=${DISPATCH_CORE_TAG:-main}" >> "$GITHUB_OUTPUT"

          # 1. Если запуск по пушу тега v* или явно заданному тегу в workflow_dispatch
          if [ "${{ github.ref_type }}" = "tag" ] || [ -n "$INPUT_TAG" ]; then
            target_tag="${INPUT_TAG:-${{ github.ref_name }}}"
            echo "tag=${target_tag}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Автоматический режим (repository_dispatch: core-updated, schedule или пустой workflow_dispatch)
          prev_notes=$(gh release view --json body -q '.body' 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "schedule" ] && echo "$prev_notes" | grep -q "core-outbound-sha:${core_sha}" && echo "$prev_notes" | grep -q "core-tag:${core_tag}"; then
            echo "Ядро ${core_tag} (outbound ${core_sha}) уже собрано в последнем релизе tachyon-desync, пропускаем."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cur_ver=$(grep -m1 '^version = ' Cargo.toml | cut -d '"' -f2 | tr -d '\r')
          IFS='.' read -r maj min pat <<< "$cur_ver"
          new_pat=$((pat + 1))
          new_ver="${maj}.${min}.${new_pat}"
          new_tag="v${new_ver}"

          # Если тег уже существует, сдвигаем патч до свободного
          while git rev-parse "$new_tag" >/dev/null 2>&1; do
            new_pat=$((new_pat + 1))
            new_ver="${maj}.${min}.${new_pat}"
            new_tag="v${new_ver}"
          done

          echo "Авто-обновление tachyon-desync: v${cur_ver} -> ${new_tag} (ядро tachyon-core ${core_tag}, outbound ${core_sha:0:8})"

          # Обновляем версию в Cargo.toml, README и SVG-плашках
          sed -i "s/^version = \"${cur_ver}\"/version = \"${new_ver}\"/" Cargo.toml
          sed -i "s/release-v${cur_ver}/release-v${new_ver}/g; s/Release v${cur_ver}/Release v${new_ver}/g" README.md README.en.md
          sed -i "s/v${cur_ver}/v${new_ver}/g" \
            assets/readme/hero-board.svg \
            assets/readme/hero-board.en.svg \
            assets/readme/section-releases.svg \
            assets/readme/section-releases.en.svg

          # Собираем сводку коммитов апстрима по outbound/desync
          core_changes=$(git -C _tachyon_core_src log -n 5 --no-merges --pretty=format:"  - %s." -- crates/core-runtime/src/outbound || true)
          if [ -z "$core_changes" ]; then
            core_changes="  - Синхронизация модулей пакетной десинхронизации с ядром \`tachyon-core ${core_tag}\`."
          fi

          {
            echo "# Changelog"
            echo ""
            echo "## ${new_ver}"
            echo ""
            echo "### Исправления и улучшения"
            echo ""
            echo "- **Автоматическая синхронизация с апстримным движком \`tachyon-core ${core_tag}\` (\`${core_sha:0:8}\`)**:"
            echo "${core_changes}"
            echo ""
            tail -n +3 CHANGELOG.md
          } > CHANGELOG.new.md
          mv CHANGELOG.new.md CHANGELOG.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml CHANGELOG.md README.md README.en.md \
            assets/readme/hero-board.svg \
            assets/readme/hero-board.en.svg \
            assets/readme/section-releases.svg \
            assets/readme/section-releases.en.svg
          git commit -m "выпуск tachyon-desync ${new_tag} (tachyon-core ${core_tag})"
          git tag "${new_tag}"
          git push origin HEAD:main
          git push origin "${new_tag}"

          echo "tag=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  build-windows:
    name: windows-amd64
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout tachyon-desync
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Checkout private desync engine from Dushnilin/tachyon-core-src
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.core_ref }}
          sparse-checkout: |
            crates/core-runtime/src/outbound
          path: _tachyon_core_src

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Test & Build tachyon-desync.exe (Release)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: link.exe
          TACHYON_CORE_OUTBOUND: ${{ github.workspace }}\_tachyon_core_src\crates\core-runtime\src\outbound
        run: |
          Remove-Item -Path .cargo\config.toml -ErrorAction SilentlyContinue
          cargo test
          cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $bin = "target\x86_64-pc-windows-msvc\release\tachyon-desync.exe"
          Copy-Item $bin "artifacts\tachyon-desync-windows-amd64.exe"
          Compress-Archive -Path $bin -DestinationPath "artifacts\tachyon-desync-windows-amd64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows-amd64
          path: artifacts/*

  build-linux:
    name: linux-${{ matrix.arch }}
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            deb_arch: amd64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: arm64
            deb_arch: arm64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout tachyon-desync
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Checkout private desync engine from Dushnilin/tachyon-core-src
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.core_ref }}
          sparse-checkout: |
            crates/core-runtime/src/outbound
          path: _tachyon_core_src

      - name: Install Linux GUI & OpenGL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build tachyon-desync (Linux ${{ matrix.arch }})
        env:
          TACHYON_CORE_OUTBOUND: ${{ github.workspace }}/_tachyon_core_src/crates/core-runtime/src/outbound
        run: |
          rm -f .cargo/config.toml
          cargo build --release --target ${{ matrix.target }}

      - name: Package Linux .tar.gz and .deb
        run: |
          mkdir -p artifacts
          tag="${{ needs.prepare.outputs.tag }}"
          ver="${tag#v}"
          bin="target/${{ matrix.target }}/release/tachyon-desync"
          strip "$bin" || true

          tar -czf "artifacts/tachyon-desync-linux-${{ matrix.arch }}.tar.gz" -C "target/${{ matrix.target }}/release" tachyon-desync

          pkg_dir="deb_root"
          mkdir -p "$pkg_dir/DEBIAN" "$pkg_dir/usr/bin" "$pkg_dir/usr/share/applications"
          cp "$bin" "$pkg_dir/usr/bin/tachyon-desync"
          chmod 0755 "$pkg_dir/usr/bin/tachyon-desync"

          cat > "$pkg_dir/DEBIAN/control" <<EOF
          Package: tachyon-desync
          Version: ${ver}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libc6, libgl1, libx11-6, libxkbcommon0, iproute2
          Maintainer: Dushnilin <Dushnilin@gmail.com>
          Description: Native L3/L4/L7 adaptive packet desynchronizer with OpenGL GUI and TUN/SOCKS5 capture.
          EOF

          cat > "$pkg_dir/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v setcap >/dev/null 2>&1; then
            setcap cap_net_admin,cap_net_raw+eip /usr/bin/tachyon-desync || true
          fi
          exit 0
          EOF
          chmod 0755 "$pkg_dir/DEBIAN/postinst"

          cat > "$pkg_dir/usr/share/applications/tachyon-desync.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Tachyon Desync
          Comment=L3/L4/L7 adaptive packet desynchronizer
          Exec=/usr/bin/tachyon-desync
          Terminal=false
          Categories=Network;Utility;
          EOF

          dpkg-deb --build "$pkg_dir" "artifacts/tachyon-desync_${{ matrix.deb_arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}
          path: artifacts/*

  build-macos:
    name: macos-universal
    needs: [prepare]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout tachyon-desync
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Checkout private desync engine from Dushnilin/tachyon-core-src
        uses: actions/checkout@v4
        with:
          repository: Dushnilin/tachyon-core-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ needs.prepare.outputs.core_ref }}
          sparse-checkout: |
            crates/core-runtime/src/outbound
          path: _tachyon_core_src

      - name: Install Rust stable (arm64 + x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build tachyon-desync (Apple Silicon + Intel)
        env:
          TACHYON_CORE_OUTBOUND: ${{ github.workspace }}/_tachyon_core_src/crates/core-runtime/src/outbound
        run: |
          rm -f .cargo/config.toml
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Package macOS .tar.gz and Universal .dmg (.app)
        run: |
          mkdir -p artifacts
          tag="${{ needs.prepare.outputs.tag }}"
          ver="${tag#v}"

          tar -czf "artifacts/tachyon-desync-macos-arm64.tar.gz" -C "target/aarch64-apple-darwin/release" tachyon-desync
          tar -czf "artifacts/tachyon-desync-macos-amd64.tar.gz" -C "target/x86_64-apple-darwin/release" tachyon-desync

          app_dir="dmg_root/Tachyon Desync.app/Contents"
          mkdir -p "$app_dir/MacOS" "$app_dir/Resources"
          lipo -create \
            target/aarch64-apple-darwin/release/tachyon-desync \
            target/x86_64-apple-darwin/release/tachyon-desync \
            -output "$app_dir/MacOS/tachyon-desync"
          chmod 0755 "$app_dir/MacOS/tachyon-desync"

          cat > "$app_dir/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>Tachyon Desync</string>
            <key>CFBundleExecutable</key>
            <string>tachyon-desync</string>
            <key>CFBundleIdentifier</key>
            <string>io.tachyon.desync</string>
            <key>CFBundleName</key>
            <string>Tachyon Desync</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${ver}</string>
            <key>CFBundleVersion</key>
            <string>${ver}</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF

          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Tachyon Desync" -srcfolder dmg_root -ov -format UDZO "artifacts/tachyon-desync-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: artifacts/*

  release:
    name: publish-release
    needs: [prepare, build-windows, build-linux, build-macos]
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS and Release Notes
        run: |
          cd artifacts
          sha256sum tachyon-desync* > SHA256SUMS
          cd ..
          tag="${{ needs.prepare.outputs.tag }}"
          ver="${tag#v}"
          awk -v want="## $ver" '
            /^## / { inside = ($0 == want) }
            inside
          ' CHANGELOG.md > section.md
          if ! grep -q '^## ' section.md; then
            cp CHANGELOG.md section.md
          fi
          {
            echo "## tachyon-desync v${ver}"
            echo ""
            tail -n +2 section.md
            echo ""
            echo "### SHA-256"
            echo ""
            echo '```text'
            cat artifacts/SHA256SUMS
            echo '```'
            echo ""
            echo "<!-- core-outbound-sha:${{ needs.prepare.outputs.core_sha }} core-tag:${{ needs.prepare.outputs.core_tag }} -->"
          } > release_notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          ver="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "v${ver}" --notes-file release_notes.md
          else
            gh release create "$tag" artifacts/* --title "v${ver}" --notes-file release_notes.md
          fi

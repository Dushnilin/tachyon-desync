<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 132" width="1200" height="132">
  <title>Tachyon Desync Metrics</title>
  <rect width="1200" height="132" rx="14" fill="#0d1117" stroke="#21262d" stroke-width="1.2"/>
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="276" height="100" rx="10" fill="#131822" stroke="#242e40" stroke-width="1"/>
    <text x="18" y="26" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">ADAPTIVE POOL L1–L3</text>
    <text x="18" y="58" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="800">24 TCP + 6 UDP</text>
    <text x="18" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Automatic probing &amp; 7-day domain pinning</text>

    <rect x="296" y="0" width="276" height="100" rx="10" fill="#131822" stroke="#242e40" stroke-width="1"/>
    <text x="314" y="26" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">TRANSFER VERIFICATION GATE</text>
    <text x="314" y="58" fill="#4cc38a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="800">32 KiB</text>
    <text x="314" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Protects against silent post-handshake drops</text>

    <rect x="592" y="0" width="276" height="100" rx="10" fill="#131822" stroke="#242e40" stroke-width="1"/>
    <text x="610" y="26" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">CAPTURE NETWORK STACK</text>
    <text x="610" y="58" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="800">Wintun · utun · tun</text>
    <text x="610" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">smoltcp TCP/UDP + per-process PID filter</text>

    <rect x="888" y="0" width="276" height="100" rx="10" fill="#131822" stroke="#242e40" stroke-width="1"/>
    <text x="906" y="26" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">CROSS-PLATFORM UI</text>
    <text x="906" y="58" fill="#f1f5f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="800">Win · Linux · macOS</text>
    <text x="906" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12">Custom window frame · OpenGL · zero WebView</text>
  </g>
</svg>
